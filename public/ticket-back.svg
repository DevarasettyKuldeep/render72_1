<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 630 880" width="630" height="880">
  <defs>
    <linearGradient id="bgGradBack" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#05070d" />
      <stop offset="50%" stop-color="#0c1220" />
      <stop offset="100%" stop-color="#04060a" />
    </linearGradient>

    <linearGradient id="neonGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe27a" />
      <stop offset="50%" stop-color="#ffb830" />
      <stop offset="100%" stop-color="#ffd54f" />
    </linearGradient>

    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <linearGradient id="backBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#ffd700" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.7" />
    </linearGradient>

    <radialGradient id="cyberGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18" />
      <stop offset="50%" stop-color="#ffd700" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <pattern id="backGrid" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#38bdf8" stroke-opacity="0.08" stroke-width="1" />
    </pattern>
  </defs>

  <style>
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .font-sans { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  </style>

  <!-- Card Background -->
  <rect x="0" y="0" width="630" height="880" rx="28" fill="url(#bgGradBack)" />
  <rect x="18" y="18" width="594" height="844" rx="22" fill="url(#backGrid)" />
  <ellipse cx="315" cy="420" rx="270" ry="260" fill="url(#cyberGlow)" />

  <!-- Borders -->
  <rect x="16" y="16" width="598" height="848" rx="22" fill="none" stroke="url(#backBorderGrad)" stroke-width="2.2" />
  <rect x="24" y="24" width="582" height="832" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" />

  <!-- Header -->
  <g transform="translate(48, 54)">
    <rect x="0" y="0" width="160" height="26" rx="13" fill="#ef4444" fill-opacity="0.16" stroke="#ef4444" stroke-opacity="0.7" stroke-width="1" />
    <circle cx="14" cy="13" r="4" fill="#ef4444" />
    <text x="28" y="17" class="font-mono" font-size="10" font-weight="800" fill="#f87171" letter-spacing="2">CLASSIFIED STUB</text>

    <text x="410" y="17" class="font-mono" font-size="11" font-weight="700" fill="#64748b" letter-spacing="1">HEX #72-SECRET</text>
  </g>

  <!-- Confidential Eyebrow Banner -->
  <g transform="translate(48, 120)">
    <text x="0" y="32" class="font-mono" font-size="28" font-weight="900" fill="#ffd700" letter-spacing="4">// PSSSSST!! //</text>
    <text x="0" y="80" class="font-sans" font-size="34" font-weight="900" fill="#f8fafc" letter-spacing="-0.5">This isn't just a hackathon.</text>
    <text x="0" y="116" class="font-sans" font-size="18" font-weight="500" fill="#94a3b8">It’s an audition for something bigger...</text>
  </g>

  <!-- Decoder Card Matrix Box -->
  <g transform="translate(48, 275)">
    <!-- Outer Container -->
    <rect x="0" y="0" width="534" height="270" rx="18" fill="#090d16" stroke="#1e293b" stroke-width="1.8" />
    
    <!-- Top terminal bar -->
    <rect x="0" y="0" width="534" height="38" rx="18" fill="#0f172a" />
    <circle cx="24" cy="19" r="5" fill="#ef4444" />
    <circle cx="42" cy="19" r="5" fill="#f59e0b" />
    <circle cx="60" cy="19" r="5" fill="#10b981" />
    <text x="84" y="24" class="font-mono" font-size="11" font-weight="700" fill="#64748b">RENDER72_CIPHER_DECODER.EXE</text>

    <!-- Stub Info Row 1: Scrambled -->
    <g transform="translate(28, 68)">
      <text x="0" y="16" class="font-mono" font-size="11" font-weight="600" fill="#64748b" letter-spacing="1.5">ENCRYPTED STUB ON EVENT PAGE</text>
      <rect x="0" y="28" width="478" height="50" rx="10" fill="#131b2e" stroke="#ef4444" stroke-opacity="0.4" stroke-width="1.2" />
      <text x="18" y="60" class="font-mono" font-size="18" font-weight="800" fill="#f87171" letter-spacing="2">Stub: 83' bilpoB</text>
    </g>

    <!-- Arrow down -->
    <g transform="translate(255, 154)">
      <path d="M 0 0 L 0 16 M -6 10 L 0 16 L 6 10" fill="none" stroke="#ffd700" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Stub Info Row 2: Decoded -->
    <g transform="translate(28, 180)">
      <text x="0" y="16" class="font-mono" font-size="11" font-weight="600" fill="#38bdf8" letter-spacing="1.5">DECODED REVERSE CIPHER</text>
      <rect x="0" y="28" width="478" height="50" rx="10" fill="#0d1b2a" stroke="#00f2fe" stroke-opacity="0.5" stroke-width="1.2" />
      <text x="18" y="60" class="font-mono" font-size="18" font-weight="800" fill="url(#neonGold)" letter-spacing="1.5">Decoded: Boplib '38</text>
      <circle cx="444" cy="53" r="10" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1.5" />
      <path d="M 439 53 L 443 57 L 449 49" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>

  <!-- Clue Insight & Location -->
  <g transform="translate(48, 575)">
    <rect x="0" y="0" width="534" height="90" rx="14" fill="#0c1220" stroke="#334155" stroke-width="1" />
    
    <text x="24" y="32" class="font-mono" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="1.5">SOURCE ARTIFACT</text>
    <text x="24" y="62" class="font-sans" font-size="16" font-weight="700" fill="#f1f5f9">Discovered on the official Render72 Portal</text>
    <text x="24" y="78" class="font-mono" font-size="11" fill="#64748b">Hidden inside event transmission telemetry &amp; stubs</text>
  </g>

  <!-- Participant Seal -->
  <g transform="translate(48, 695)">
    <rect x="0" y="0" width="534" height="110" rx="14" fill="#080c14" stroke="url(#backBorderGrad)" stroke-width="1.2" />

    <g transform="translate(30, 26)">
      <circle cx="28" cy="28" r="26" fill="#ffd700" fill-opacity="0.1" stroke="#ffd700" stroke-width="1.5" />
      <text x="28" y="34" class="font-mono" font-size="13" font-weight="900" fill="#ffd700" text-anchor="middle">R72</text>
    </g>

    <g transform="translate(100, 36)">
      <text x="0" y="14" class="font-mono" font-size="10" font-weight="700" fill="#ffd700" letter-spacing="1.8">PARTICIPANT SUBMISSION VERIFIED</text>
      <text x="0" y="38" class="font-sans" font-size="13" font-weight="600" fill="#cbd5e1">Render72 Evaluation Team Ready</text>
      <text x="0" y="56" class="font-mono" font-size="10" fill="#64748b">No organizing team credentials claimed · Independent build</text>
    </g>
  </g>

  <!-- Flip back button indicator -->
  <g transform="translate(230, 825)">
    <text x="85" y="16" class="font-sans" font-size="12" font-weight="600" fill="#94a3b8" text-anchor="middle">Click card to flip back ↻</text>
  </g>
</svg>
